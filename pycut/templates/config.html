/* DEV-463: compact, legible responsive config layout; existing controls remain native. */
:root{--bg:#101820;--surface:#1b2935;--fg:#eaf0f4;--muted:#b9c7d1;--line:#364b5b}
html{scroll-padding-top:28px;scroll-padding-bottom:132px}
body{min-width:320px}
main{max-width:1220px;padding:24px 36px 142px}
.top{padding-bottom:16px;margin-bottom:24px}
.intro{margin-bottom:24px}.intro h1{font-size:27px;margin-bottom:6px}.intro p{margin:0}
.workspace{grid-template-columns:194px minmax(0,1fr);gap:32px;align-items:start}
aside{top:20px}.aside-note{margin:18px 10px;overflow-wrap:anywhere}
nav button{border-radius:9px;padding:10px 13px}
.panel{min-width:0}.panel>fieldset>legend{font-size:20px}.section-copy{font-size:13px;margin:0 0 18px}
#directories .fields{gap:0}
.multi-directory{padding:18px 0 16px;margin:0;border-top:1px solid var(--line)}
.multi-directory:first-child{padding-top:0;border-top:0}
.multi-directory legend{line-height:1.4;margin-bottom:4px!important}
.multi-directory small{font-size:12px;line-height:1.5;margin:0 0 10px}
.multi-directory legend .optional{border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px}
.directory-list{gap:7px}
.directory-row{grid-template-columns:minmax(0,1fr) 74px 55px;align-items:start;gap:8px}
.directory-row input{font-size:13px;min-height:42px;height:42px;text-overflow:ellipsis}
.directory-row input:focus{text-overflow:clip}
.directory-row .browse,.directory-row .remove-directory{min-height:42px;height:42px;padding:6px 8px;font-size:13px}

.bottom-inner{max-width:1148px}.primary{border-radius:8px;min-width:112px}
#status{font-size:13px}.save-note{line-height:1.4}

/* DEV-464: additional interaction/accessibility refinements on DEV-463 layout */
:root{--savebar-height:92px}
html{scroll-padding-bottom:calc(var(--savebar-height) + 30px)}
main{padding-bottom:calc(var(--savebar-height) + 44px)}
:where(input,button,.field){scroll-margin-bottom:calc(var(--savebar-height) + 30px)}
.intro{display:flex;align-items:center;justify-content:space-between;gap:16px}
.intro>div{min-width:0}
.page-state{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border:1px solid var(--line);border-radius:100px;font-size:12px;white-space:nowrap;color:var(--muted);background:var(--surface)}
.page-state:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.page-state[data-state="ready"]{color:var(--accent);border-color:#3b7169}
.page-state[data-state="warning"],.page-state[data-state="dirty"]{color:#f3cf94;border-color:#786244}
.page-state[data-state="error"]{color:var(--error);border-color:#90645d}
.optional.is-required{color:var(--accent)!important;border:1px solid #3b7169;border-radius:99px;padding:1px 8px;font-size:11px}
.optional:empty{display:none}
nav button[aria-pressed=true]{position:relative}

#directories .fields{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;row-gap:0}

.field input:focus{border-color:var(--accent);outline:2px solid #80d5c250;outline-offset:0}
.browse:disabled{opacity:.55;cursor:wait}
.bottom{background:#1c2b36f2;backdrop-filter:blur(12px)}
@media(min-width:1120px){
  #directories .multi-directory[data-key="PYCUT_PIP_DIR"],
  #directories .multi-directory[data-key="PYCUT_INTRO_DIR"]{grid-column:auto}
  #directories .multi-directory[data-key="PYCUT_PIP_DIR"] .directory-row,
  #directories .multi-directory[data-key="PYCUT_INTRO_DIR"] .directory-row{gap:5px;grid-template-columns:minmax(0,1fr) 68px 49px}
}
@media(max-width:900px){#directories .fields{grid-template-columns:minmax(0,1fr)}}
@media(max-width:680px){
  main{padding-bottom:calc(var(--savebar-height) + 36px)}
  .intro{align-items:flex-start;gap:10px}
  .page-state{font-size:11px;padding:4px 8px}
  nav button[aria-pressed=true]:before{top:auto;bottom:0;left:20%;right:20%;width:auto;height:3px}
}
@media(max-width:430px){.intro h1{font-size:23px}.page-state{font-size:10px}}

<body><main><header class="top"><span class="brand">pycut</span><span class="local">本机配置 · 自动读取 .env</span></header>
<div class="intro"><div><h1>视频处理配置</h1><p>按需设置素材目录与 LLM 网关。路径保存在本机，保存后返回终端即可使用。</p></div><span id="page-state" class="page-state" data-state="loading">正在读取</span></div>
<div class="workspace"><aside><nav aria-label="配置分类"><button type="button" aria-pressed="true" aria-controls="directories" data-panel="directories">视频目录</button><button type="button" aria-pressed="false" aria-controls="llm" data-panel="llm">LLM 网关</button></nav><p class="aside-note"><strong>配置文件</strong><code id="location">正在读取…</code><br><br>也可以直接编辑 .env。每次开始任务都会重新读取配置。</p></aside>
<form id="config"><div id="overrides" class="notice"></div><section id="directories" class="panel" aria-label="视频目录"><fieldset><legend>视频目录</legend><p class="section-copy">目录均为当前机器路径；支持直接粘贴或使用「选择…」。多目录按行管理。</p><div class="fields">DIRECTORY_FIELDS</div></fieldset></section><section id="llm" class="panel" aria-label="LLM 网关" hidden><fieldset><legend>LLM 网关</legend><p class="section-copy">用于人脸兜底和字幕定位。备用网关可选，密钥不会回显。</p><div class="fields">LLM_FIELDS</div></fieldset></section></form></div></main>
<footer class="bottom"><div class="bottom-inner"><div class="status-wrap"><p id="status" role="status" aria-live="polite">正在读取配置…</p><div class="save-note">保存到项目 .env，处理任务开始时生效</div></div><button type="submit" form="config" id="save" class="primary" disabled aria-keyshortcuts="Control+S Meta+S">保存配置</button></div></footer>
<script>
const token=TOKEN_VALUE, labels=FIELD_LABELS, multiFields=MULTI_FIELDS, form=document.getElementById('config'), status=document.getElementById('status'), save=document.getElementById('save');
let dirty=false,loading=true,saving=false,revision=0;
form.inert=true;
const pageState=document.getElementById('page-state');
function markState(label,kind){pageState.textContent=label;pageState.dataset.state=kind;}
const bottom=document.querySelector('.bottom');
function measureBottom(){document.documentElement.style.setProperty('--savebar-height',Math.ceil(bottom.getBoundingClientRect().height)+'px');}
measureBottom();if('ResizeObserver' in window)new ResizeObserver(measureBottom).observe(bottom);
function selectPanel(id){document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==id);document.querySelectorAll('[data-panel]').forEach(b=>{const active=b.dataset.panel===id;b.setAttribute('aria-pressed',String(active));if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>selectPanel(b.dataset.panel)));
function showOverrides(fields){document.getElementById('overrides').textContent=fields.length?'外部环境变量优先：'+fields.join('、')+'。修改 .env 后，请移除对应环境变量并重启程序以生效。':'';}
let directoryRowId=0;
function directoryInputs(key){return Array.from(document.querySelector(`.directory-list[data-key="${key}"]`).querySelectorAll('input'));}
function syncDirectories(key){const values=[...new Set(directoryInputs(key).map(input=>input.value.trim()).filter(Boolean))];form.elements[key].value=values.length?JSON.stringify(values):'';}
function clearProblems(key){document.getElementById(key+'-error').textContent='';if(multiFields.includes(key)){document.querySelector(`.add-directory[data-key="${key}"]`).removeAttribute('aria-invalid');for(const input of directoryInputs(key)){input.removeAttribute('aria-invalid');document.getElementById(input.id+'-error').textContent='';}}else form.elements[key].removeAttribute('aria-invalid');}
function changed(key){dirty=true;revision++;status.className='';status.textContent='有未保存的修改';markState('未保存','dirty');save.disabled=loading||saving;if(key)clearProblems(key);}
form.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(!save.disabled)form.requestSubmit();}});
function numberDirectoryRows(key){directoryInputs(key).forEach((input,i)=>{input.setAttribute('aria-label',`${labels[key]} 第${i+1}个目录`);input.closest('.directory-row').querySelector('.remove-directory').setAttribute('aria-label',`移除${labels[key]} 第${i+1}个目录`);});}
function addDirectory(key,value='',focus=false){
 const list=document.querySelector(`.directory-list[data-key="${key}"]`),row=document.createElement('div');row.className='directory-row';
 const input=document.createElement('input');input.type='text';input.title=value||'输入本机目录';input.addEventListener('input',()=>{input.title=input.value;});input.id=key+'-row-'+(++directoryRowId);input.value=value;input.dataset.key=key;input.placeholder='输入本机目录，或点击选择';input.autocomplete='off';input.spellcheck=false;input.setAttribute('aria-describedby',key+'-help '+input.id+'-error');
 const browseButton=document.createElement('button');browseButton.type='button';browseButton.className='browse';browseButton.dataset.key=key;browseButton.textContent='选择…';browseButton.setAttribute('aria-label','选择'+labels[key]);
 const remove=document.createElement('button');remove.type='button';remove.className='remove-directory';remove.textContent='移除';remove.addEventListener('click',()=>{row.remove();numberDirectoryRows(key);syncDirectories(key);changed(key);const next=directoryInputs(key);(next[next.length-1]||document.querySelector(`.add-directory[data-key="${key}"]`)).focus();});
 const error=document.createElement('span');error.className='field-error';error.id=input.id+'-error';row.append(input,browseButton,remove,error);list.appendChild(row);numberDirectoryRows(key);if(focus)input.focus();
}
function loadDirectories(key,value){let paths=[];if(value.trim()){try{const parsed=JSON.parse(value);paths=Array.isArray(parsed)&&parsed.every(v=>typeof v==='string')?parsed:[value];}catch(e){paths=[value];}}document.querySelector(`.directory-list[data-key="${key}"]`).replaceChildren();for(const path of paths)addDirectory(key,path);syncDirectories(key);}
document.querySelectorAll('.add-directory').forEach(button=>button.addEventListener('click',()=>{addDirectory(button.dataset.key,'',true);changed(button.dataset.key);}));
function showProblems(problems){
 for(const [key,label] of Object.entries(labels)){
  const errors=problems.filter(p=>p.startsWith(label));clearProblems(key);
  if(multiFields.includes(key)){
   const general=errors.filter(error=>!error.match(/第\s*(\d+)\s*项/));document.getElementById(key+'-error').textContent=general.join('；');if(!directoryInputs(key).length&&general.length){const add=document.querySelector(`.add-directory[data-key="${key}"]`);add.setAttribute('aria-invalid','true');add.setAttribute('aria-describedby',key+'-error');}
   directoryInputs(key).forEach((input,i)=>{const itemErrors=errors.filter(error=>{const match=error.match(/第\s*(\d+)\s*项/);return match&&Number(match[1])===i+1;});input.setAttribute('aria-invalid',String(Boolean(itemErrors.length||general.length)));document.getElementById(input.id+'-error').textContent=itemErrors.join('；');});
  }else{form.elements[key].setAttribute('aria-invalid',String(Boolean(errors.length)));document.getElementById(key+'-error').textContent=errors.join('；');}
 }
 return problems.length;
}
form.addEventListener('input',e=>{const key=e.target.dataset.key||e.target.name;if(multiFields.includes(key))syncDirectories(key);changed(key);});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
async function load(){try{const r=await fetch('/api/config',{headers:{'X-Config-Token':token}});if(!r.ok)throw Error('读取失败');const data=await r.json();for(const [k,v] of Object.entries(data.values)){if(multiFields.includes(k))loadDirectories(k,v);else if(form.elements[k])form.elements[k].value=v;}for(const k of data.configured_keys)form.elements[k].placeholder='已配置，留空保持不变';document.getElementById('location').textContent=data.path;showOverrides(data.overrides);showProblems(data.problems);status.textContent=data.problems.length?`还有 ${data.problems.length} 项待配置`:'目录已就绪，可以返回终端开始处理';markState(data.problems.length?'待完善':'已加载',data.problems.length?'warning':'ready');loading=false;form.inert=false;}catch(e){status.className='error';status.textContent='读取失败，请刷新页面重试';markState('读取失败','error');}save.disabled=loading||!dirty;}
form.addEventListener('submit',async e=>{e.preventDefault();if(loading||saving)return;saving=true;save.disabled=true;save.textContent='正在保存…';status.className='';status.textContent='正在保存配置…';markState('保存中','loading');const submittedRevision=revision;try{multiFields.forEach(key=>{syncDirectories(key);loadDirectories(key,form.elements[key].value);});const values=Object.fromEntries(new FormData(form));const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-Config-Token':token},body:JSON.stringify(values)});const data=await r.json();showProblems(data.problems||[]);if(!r.ok){const invalid=form.querySelector('[aria-invalid=true]');if(invalid){selectPanel(invalid.closest('.panel').id);invalid.focus({preventScroll:true});invalid.scrollIntoView({block:'center'});}throw Error(data.error);}dirty=revision!==submittedRevision;showOverrides(data.overrides);status.textContent=dirty?'配置已保存；还有新修改未保存':data.problems.length?`已保存；还有 ${data.problems.length} 项待配置`:'已保存，目录已就绪。返回终端即可开始';markState(dirty?'未保存':data.problems.length?'待完善':'已保存',dirty?'dirty':data.problems.length?'warning':'ready');if(!dirty)for(const key of multiFields)loadDirectories(key,data.values?.[key]??form.elements[key].value);if(!dirty)for(const input of form.querySelectorAll('input[type=password]')){if(input.value)input.placeholder='已配置，留空保持不变';input.value='';}}catch(e){status.className='error';status.textContent=e.message==='Failed to fetch'?'连接中断，请确认程序仍在运行后重试':e.message;markState('保存失败','error');}finally{saving=false;save.textContent='保存配置';save.disabled=loading||!dirty;}});load();
let picking=false;
async function openBrowse(button,key){
 if(picking||loading||saving)return;
 const input=button.closest('.directory-row')?.querySelector('input')||form.elements[key], original=input.value;
 picking=true;document.querySelectorAll('.browse').forEach(b=>b.disabled=true);button.setAttribute('aria-busy','true');
 status.className='';status.textContent='正在打开系统文件夹窗口，请选择目录或取消';
 try{
  const r=await fetch('/api/pick-directory',{method:'POST',headers:{'Content-Type':'application/json','X-Config-Token':token},body:JSON.stringify({key,path:original.trim()})});
  const data=await r.json();if(!r.ok)throw Error(data.error||'无法打开系统窗口，请手动输入目录路径');
  if(data.cancelled){status.textContent='已取消选择，目录保持不变';return;}
  if(!input.isConnected||input.value!==original){status.textContent='目录输入已变动，已忽略本次选择；请重新选择';return;}
  if(typeof data.path!=='string'||!data.path)throw Error('系统未返回有效目录，请手动输入路径');
  input.value=data.path;input.dispatchEvent(new Event('input',{bubbles:true}));
 }catch(e){status.className='error';status.textContent=e.message==='Failed to fetch'?'连接中断，请确认程序仍在运行，或手动输入目录路径':e.message;}
 finally{picking=false;document.querySelectorAll('.browse').forEach(b=>b.disabled=false);button.removeAttribute('aria-busy');if(button.isConnected)button.focus();}
}
form.addEventListener('click',e=>{const button=e.target.closest('.browse');if(button)openBrowse(button,button.dataset.key);});
</script></body></html>
