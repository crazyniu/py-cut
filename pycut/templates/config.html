<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pycut · 视频处理配置</title>
<style>
:root{color-scheme:dark;--bg:#101820;--surface:#1b2935;--fg:#eaf0f4;--muted:#b4c1cd;--line:#415363;--accent:#80d5c2;--error:#ffb6aa}*{box-sizing:border-box}html{scroll-padding-top:24px;scrollbar-color:var(--line) var(--bg)}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:38px 32px 160px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:30px}.brand{font-size:22px;font-weight:700;letter-spacing:-.02em}.local{color:var(--muted);font-size:13px}h1{font-size:30px;letter-spacing:-.025em;line-height:1.3;margin:0 0 12px}p{color:var(--muted);max-width:70ch;margin:8px 0}.intro{margin-bottom:28px}.workspace{display:grid;grid-template-columns:210px minmax(0,1fr);gap:48px}aside{align-self:start;position:sticky;top:24px}nav{display:flex;flex-direction:column;gap:8px}button{font:inherit;cursor:pointer;border-radius:6px;min-height:44px}nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:10px 14px}nav button:hover{background:var(--surface);color:var(--fg)}nav button[aria-pressed=true]{border-color:var(--line);background:var(--surface);color:var(--accent);font-weight:650}.aside-note{font-size:13px;margin:22px 14px}.aside-note strong{display:block;color:var(--fg);font-weight:500;margin-bottom:6px}code{overflow-wrap:anywhere;font-size:12px}.panel[hidden]{display:none}fieldset{padding:0;margin:0;border:0;min-width:0}legend{font-size:21px;font-weight:650;margin-bottom:4px;padding:0}.section-copy{margin:0 0 24px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.field{min-width:0}.field:has(#PYCUT_INTRO_DIR),.field:has(#PYCUT_STICKER_DIR),.field:has(input[type=password]){grid-column:1/-1}label{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-weight:550}.optional{font-size:12px;color:var(--muted);font-weight:400}input{width:100%;min-height:46px;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;caret-color:var(--accent)}input:hover{border-color:var(--muted)}input::placeholder{color:var(--muted);opacity:1}input[aria-invalid=true]{border-color:var(--error)}small{display:block;color:var(--muted);font-size:12px;margin-top:7px}.field-error{display:block;color:var(--error);font-size:13px;margin-top:4px}.field-error:empty{display:none}.notice{border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin-bottom:24px;color:var(--muted);font-size:14px}.notice:empty{display:none}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:16px 32px}.bottom-inner{max-width:1016px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}.status-wrap{min-width:0}#status{margin:0;color:var(--fg);font-size:14px}#status.error{color:var(--error)}.save-note{font-size:12px;color:var(--muted);margin-top:2px}.primary{border:0;flex-shrink:0;padding:10px 24px;background:var(--accent);color:#10211e;font-weight:650}.primary:hover{background:#a4e7d9}.primary:active{background:#66c7b1}.primary:disabled{opacity:.6;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}::selection{background:var(--accent);color:#10211e}@media(max-width:760px){main{padding:22px 20px 160px}.top{margin-bottom:24px}.workspace{grid-template-columns:1fr;gap:24px}aside{position:static}nav{flex-direction:row}nav button{flex:1;text-align:center}.aside-note{display:none}.fields{gap:20px}h1{font-size:26px}.bottom{padding:14px 20px}}@media(max-width:480px){.fields{grid-template-columns:1fr}.bottom-inner{gap:12px}.primary{padding:10px 16px}.save-note{max-width:24ch}.local{font-size:12px}}
</style></head>
<body><main><header class="top"><span class="brand">pycut</span><span class="local">本机配置 · 自动读取 .env</span></header>
<div class="intro"><h1>视频处理配置</h1><p>设置素材目录和 LLM 网关，保存后回到终端开始处理。</p></div>
<div class="workspace"><aside><nav aria-label="配置分类"><button type="button" aria-pressed="true" aria-controls="directories" data-panel="directories">视频目录</button><button type="button" aria-pressed="false" aria-controls="llm" data-panel="llm">LLM 网关</button></nav><p class="aside-note"><strong>配置文件</strong><code id="location">正在读取…</code><br><br>也可以直接编辑 .env。每次开始任务都会重新读取配置。</p></aside>
<form id="config"><div id="overrides" class="notice"></div><section id="directories" class="panel" aria-label="视频目录"><fieldset><legend>视频目录</legend><p class="section-copy">填写本机路径；相对路径以项目根目录为准。</p><div class="fields">DIRECTORY_FIELDS</div></fieldset></section><section id="llm" class="panel" aria-label="LLM 网关" hidden><fieldset><legend>LLM 网关</legend><p class="section-copy">用于人脸兜底和字幕定位。备用网关可选，密钥不会回显。</p><div class="fields">LLM_FIELDS</div></fieldset></section></form></div></main>
<footer class="bottom"><div class="bottom-inner"><div class="status-wrap"><p id="status" role="status" aria-live="polite">正在读取配置…</p><div class="save-note">保存到项目 .env，处理任务开始时生效</div></div><button type="submit" form="config" id="save" class="primary" disabled>保存配置</button></div></footer>
<script>
const token=TOKEN_VALUE, labels=FIELD_LABELS, form=document.getElementById('config'), status=document.getElementById('status'), save=document.getElementById('save');
let dirty=false,loading=true,saving=false,revision=0;
function selectPanel(id){document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==id);document.querySelectorAll('[data-panel]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.panel===id)));}
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>selectPanel(b.dataset.panel)));
function showOverrides(fields){document.getElementById('overrides').textContent=fields.length?'外部环境变量优先：'+fields.join('、')+'。修改 .env 后，请移除对应环境变量并重启程序以生效。':'';}
function showProblems(problems){for(const [key,label] of Object.entries(labels)){const error=problems.find(p=>p.startsWith(label))||'';form.elements[key].setAttribute('aria-invalid',String(Boolean(error)));document.getElementById(key+'-error').textContent=error;}return problems.length;}
form.addEventListener('input',e=>{dirty=true;revision++;status.className='';status.textContent='有未保存的修改';save.disabled=loading||saving;const key=e.target.name;if(key){e.target.removeAttribute('aria-invalid');document.getElementById(key+'-error').textContent='';}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
async function load(){try{const r=await fetch('/api/config',{headers:{'X-Config-Token':token}});if(!r.ok)throw Error('读取失败');const data=await r.json();for(const [k,v] of Object.entries(data.values))form.elements[k].value=v;for(const k of data.configured_keys)form.elements[k].placeholder='已配置，留空保持不变';document.getElementById('location').textContent=data.path;showOverrides(data.overrides);showProblems(data.problems);status.textContent=data.problems.length?`还有 ${data.problems.length} 项待配置`:'目录已就绪，可以返回终端开始处理';loading=false;}catch(e){status.className='error';status.textContent='读取失败，请刷新页面重试';}save.disabled=loading||!dirty;}
form.addEventListener('submit',async e=>{e.preventDefault();if(loading||saving)return;saving=true;save.disabled=true;save.textContent='正在保存…';status.className='';status.textContent='正在保存配置…';const submittedRevision=revision;try{const values=Object.fromEntries(new FormData(form));const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-Config-Token':token},body:JSON.stringify(values)});const data=await r.json();showProblems(data.problems||[]);if(!r.ok){const invalid=form.querySelector('[aria-invalid=true]');if(invalid){selectPanel(invalid.closest('.panel').id);invalid.focus();}throw Error(data.error);}dirty=revision!==submittedRevision;showOverrides(data.overrides);status.textContent=dirty?'配置已保存；还有新修改未保存':data.problems.length?`已保存；还有 ${data.problems.length} 项待配置`:'已保存，目录已就绪。返回终端即可开始';if(!dirty)for(const input of form.querySelectorAll('input[type=password]')){if(input.value)input.placeholder='已配置，留空保持不变';input.value='';}}catch(e){status.className='error';status.textContent=e.message==='Failed to fetch'?'连接中断，请确认程序仍在运行后重试':e.message;}finally{saving=false;save.textContent='保存配置';save.disabled=loading||!dirty;}});load();
</script></body></html>
