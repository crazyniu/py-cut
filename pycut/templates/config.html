<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>pycut · 视频处理配置</title>
<style>
:root{color-scheme:dark;--bg:#101820;--surface:#1b2935;--fg:#eaf0f4;--muted:#b4c1cd;--line:#415363;--accent:#80d5c2;--error:#ffb6aa}*{box-sizing:border-box}html{scroll-padding-top:24px;scrollbar-color:var(--line) var(--bg)}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:38px 32px 160px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:30px}.brand{font-size:22px;font-weight:700;letter-spacing:-.02em}.local{color:var(--muted);font-size:13px}h1{font-size:30px;letter-spacing:-.025em;line-height:1.3;margin:0 0 12px}p{color:var(--muted);max-width:70ch;margin:8px 0}.intro{margin-bottom:28px}.workspace{display:grid;grid-template-columns:210px minmax(0,1fr);gap:48px}aside{align-self:start;position:sticky;top:24px}nav{display:flex;flex-direction:column;gap:8px}button{font:inherit;cursor:pointer;border-radius:6px;min-height:44px}nav button{border:1px solid transparent;background:transparent;color:var(--muted);text-align:left;padding:10px 14px}nav button:hover{background:var(--surface);color:var(--fg)}nav button[aria-pressed=true]{border-color:var(--line);background:var(--surface);color:var(--accent);font-weight:650}.aside-note{font-size:13px;margin:22px 14px}.aside-note strong{display:block;color:var(--fg);font-weight:500;margin-bottom:6px}code{overflow-wrap:anywhere;font-size:12px}.panel[hidden]{display:none}fieldset{padding:0;margin:0;border:0;min-width:0}legend{font-size:21px;font-weight:650;margin-bottom:4px;padding:0}.section-copy{margin:0 0 24px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.field{min-width:0}.field:has(#PYCUT_INTRO_DIR),.field:has(#PYCUT_STICKER_DIR),.field:has(input[type=password]){grid-column:1/-1}label{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-weight:550}.optional{font-size:12px;color:var(--muted);font-weight:400}input{width:100%;min-height:46px;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;caret-color:var(--accent)}input:hover{border-color:var(--muted)}input::placeholder{color:var(--muted);opacity:1}input[aria-invalid=true]{border-color:var(--error)}.input-row{display:flex;gap:8px}.input-row input{flex:1;min-width:0}.browse{flex-shrink:0;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 14px}.browse:hover{border-color:var(--accent);color:var(--accent)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}.modal[hidden]{display:none}.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);max-height:80vh;display:flex;flex-direction:column;overflow:hidden}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:17px;margin:0;font-weight:650}.modal-close{border:0;background:transparent;color:var(--muted);font-size:22px;line-height:1;min-height:0;padding:0 6px}.modal-close:hover{color:var(--fg)}.modal-path{padding:10px 18px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;overflow-wrap:anywhere}.modal-error{padding:10px 18px;color:var(--error);font-size:14px}.modal-error[hidden]{display:none}.modal-quick{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line)}.modal-quick button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 12px;font-size:13px;min-height:0}.modal-quick button:hover{color:var(--accent);border-color:var(--accent)}.modal-list{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1;min-height:120px}.modal-list button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--fg);text-align:left;padding:9px 12px;border-radius:6px;font:inherit}.modal-list button:hover{background:var(--bg)}.modal-list button::before{content:'▸';color:var(--muted)}.modal-empty{padding:18px;color:var(--muted);font-size:14px}.modal-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}.modal-foot .secondary{border:1px solid var(--line);background:transparent;color:var(--fg);padding:9px 16px}.modal-foot .secondary:hover{border-color:var(--accent);color:var(--accent)}small{display:block;color:var(--muted);font-size:12px;margin-top:7px}.field-error{display:block;color:var(--error);font-size:13px;margin-top:4px}.field-error:empty{display:none}.notice{border:1px solid var(--line);border-radius:6px;padding:12px 16px;margin-bottom:24px;color:var(--muted);font-size:14px}.notice:empty{display:none}.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:16px 32px}.bottom-inner{max-width:1016px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}.status-wrap{min-width:0}#status{margin:0;color:var(--fg);font-size:14px}#status.error{color:var(--error)}.save-note{font-size:12px;color:var(--muted);margin-top:2px}.primary{border:0;flex-shrink:0;padding:10px 24px;background:var(--accent);color:#10211e;font-weight:650}.primary:hover{background:#a4e7d9}.primary:active{background:#66c7b1}.primary:disabled{opacity:.6;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}::selection{background:var(--accent);color:#10211e}@media(max-width:760px){main{padding:22px 20px 160px}.top{margin-bottom:24px}.workspace{grid-template-columns:1fr;gap:24px}aside{position:static}nav{flex-direction:row}nav button{flex:1;text-align:center}.aside-note{display:none}.fields{gap:20px}h1{font-size:26px}.bottom{padding:14px 20px}}@media(max-width:480px){.fields{grid-template-columns:1fr}.bottom-inner{gap:12px}.primary{padding:10px 16px}.save-note{max-width:24ch}.local{font-size:12px}}

#directories .fields{grid-template-columns:minmax(0,1fr);gap:28px}.multi-directory{padding-top:22px;border-top:1px solid var(--line)}.multi-directory legend{font-size:16px;font-weight:550;width:100%;display:flex;justify-content:space-between;margin-bottom:0}.multi-directory small{margin:0 0 12px}.directory-list{display:flex;flex-direction:column;gap:10px}.directory-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px}.directory-row .field-error{grid-column:1/-1;margin:0}.remove-directory,.add-directory{border:1px solid var(--line);background:transparent;color:var(--muted);padding:9px 12px}.remove-directory:hover{color:var(--error);border-color:var(--error)}.add-directory{color:var(--accent);margin-top:12px;padding:7px 14px}.add-directory:hover{border-color:var(--accent)}.directory-row input{min-width:0}.multi-directory legend .optional{align-self:center}.multi-directory .field-error{white-space:pre-line}
@media(max-width:480px){.input-row{gap:6px}.browse{padding:9px 11px}.directory-row{grid-template-columns:minmax(0,1fr) auto;gap:7px}.directory-row input{grid-column:1/-1}.directory-row .browse,.directory-row .remove-directory{min-height:40px}.directory-row{padding-bottom:12px;border-bottom:1px solid var(--line)}.modal{padding:12px}.modal-foot{padding:12px;gap:6px}.modal-foot .primary,.modal-foot .secondary{padding:9px 12px}}
</style></head>
<body><main><header class="top"><span class="brand">pycut</span><span class="local">本机配置 · 自动读取 .env</span></header>
<div class="intro"><h1>视频处理配置</h1><p>设置素材目录和 LLM 网关，保存后回到终端开始处理。</p></div>
<div class="workspace"><aside><nav aria-label="配置分类"><button type="button" aria-pressed="true" aria-controls="directories" data-panel="directories">视频目录</button><button type="button" aria-pressed="false" aria-controls="llm" data-panel="llm">LLM 网关</button></nav><p class="aside-note"><strong>配置文件</strong><code id="location">正在读取…</code><br><br>也可以直接编辑 .env。每次开始任务都会重新读取配置。</p></aside>
<form id="config"><div id="overrides" class="notice"></div><section id="directories" class="panel" aria-label="视频目录"><fieldset><legend>视频目录</legend><p class="section-copy">填写运行 pycut 这台机器上的目录路径，或点「选择…」浏览本机目录；相对路径以项目根目录为准。</p><div class="fields">DIRECTORY_FIELDS</div></fieldset></section><section id="llm" class="panel" aria-label="LLM 网关" hidden><fieldset><legend>LLM 网关</legend><p class="section-copy">用于人脸兜底和字幕定位。备用网关可选，密钥不会回显。</p><div class="fields">LLM_FIELDS</div></fieldset></section></form></div></main>
<div class="modal" id="browse-modal" hidden><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="browse-title"><div class="modal-head"><h2 id="browse-title">选择目录</h2><button type="button" class="modal-close" id="browse-close" aria-label="关闭">×</button></div><div class="modal-path" id="browse-path"></div><div class="modal-error" id="browse-error" hidden></div><div class="modal-quick" id="browse-roots"></div><ul class="modal-list" id="browse-list"></ul><div class="modal-foot"><button type="button" class="secondary" id="browse-up">上级</button><span style="flex:1"></span><button type="button" class="secondary" id="browse-cancel">取消</button><button type="button" class="primary" id="browse-select">选择当前目录</button></div></div></div>
<footer class="bottom"><div class="bottom-inner"><div class="status-wrap"><p id="status" role="status" aria-live="polite">正在读取配置…</p><div class="save-note">保存到项目 .env，处理任务开始时生效</div></div><button type="submit" form="config" id="save" class="primary" disabled>保存配置</button></div></footer>
<script>
const token=TOKEN_VALUE, labels=FIELD_LABELS, multiFields=MULTI_FIELDS, form=document.getElementById('config'), status=document.getElementById('status'), save=document.getElementById('save');
let dirty=false,loading=true,saving=false,revision=0;
function selectPanel(id){document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!==id);document.querySelectorAll('[data-panel]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.panel===id)));}
document.querySelectorAll('[data-panel]').forEach(b=>b.addEventListener('click',()=>selectPanel(b.dataset.panel)));
function showOverrides(fields){document.getElementById('overrides').textContent=fields.length?'外部环境变量优先：'+fields.join('、')+'。修改 .env 后，请移除对应环境变量并重启程序以生效。':'';}
let directoryRowId=0;
function directoryInputs(key){return Array.from(document.querySelector(`.directory-list[data-key="${key}"]`).querySelectorAll('input'));}
function syncDirectories(key){const values=[...new Set(directoryInputs(key).map(input=>input.value.trim()).filter(Boolean))];form.elements[key].value=values.length?JSON.stringify(values):'';}
function clearProblems(key){document.getElementById(key+'-error').textContent='';if(multiFields.includes(key)){document.querySelector(`.add-directory[data-key="${key}"]`).removeAttribute('aria-invalid');for(const input of directoryInputs(key)){input.removeAttribute('aria-invalid');document.getElementById(input.id+'-error').textContent='';}}else form.elements[key].removeAttribute('aria-invalid');}
function changed(key){dirty=true;revision++;status.className='';status.textContent='有未保存的修改';save.disabled=loading||saving;if(key)clearProblems(key);}
function numberDirectoryRows(key){directoryInputs(key).forEach((input,i)=>{input.setAttribute('aria-label',`${labels[key]} 第${i+1}个目录`);input.closest('.directory-row').querySelector('.remove-directory').setAttribute('aria-label',`移除${labels[key]} 第${i+1}个目录`);});}
function addDirectory(key,value='',focus=false){
 const list=document.querySelector(`.directory-list[data-key="${key}"]`),row=document.createElement('div');row.className='directory-row';
 const input=document.createElement('input');input.type='text';input.id=key+'-row-'+(++directoryRowId);input.value=value;input.dataset.key=key;input.placeholder='输入本机目录，或点击选择';input.autocomplete='off';input.spellcheck=false;input.setAttribute('aria-describedby',key+'-help '+input.id+'-error');
 const browseButton=document.createElement('button');browseButton.type='button';browseButton.className='browse';browseButton.dataset.key=key;browseButton.textContent='选择…';browseButton.setAttribute('aria-label','选择'+labels[key]);
 const remove=document.createElement('button');remove.type='button';remove.className='remove-directory';remove.textContent='移除';remove.addEventListener('click',()=>{row.remove();numberDirectoryRows(key);syncDirectories(key);changed(key);const next=directoryInputs(key);(next[next.length-1]||document.querySelector(`.add-directory[data-key="${key}"]`)).focus();});
 const error=document.createElement('span');error.className='field-error';error.id=input.id+'-error';row.append(input,browseButton,remove,error);list.appendChild(row);numberDirectoryRows(key);if(focus)input.focus();
}
function loadDirectories(key,value){let paths=[];if(value.trim()){try{const parsed=JSON.parse(value);paths=Array.isArray(parsed)&&parsed.every(v=>typeof v==='string')?parsed:[value];}catch(e){paths=[value];}}document.querySelector(`.directory-list[data-key="${key}"]`).replaceChildren();for(const path of paths)addDirectory(key,path);syncDirectories(key);}
document.querySelectorAll('.add-directory').forEach(button=>button.addEventListener('click',()=>{addDirectory(button.dataset.key,'',true);changed(button.dataset.key);}));
function showProblems(problems){
 for(const [key,label] of Object.entries(labels)){
  const errors=problems.filter(p=>p.startsWith(label));clearProblems(key);
  if(multiFields.includes(key)){
   const general=errors.filter(error=>!error.match(/第\s*(\d+)\s*项/));document.getElementById(key+'-error').textContent=general.join('；');if(!directoryInputs(key).length&&general.length){const add=document.querySelector(`.add-directory[data-key="${key}"]`);add.setAttribute('aria-invalid','true');add.setAttribute('aria-describedby',key+'-error');}
   directoryInputs(key).forEach((input,i)=>{const itemErrors=errors.filter(error=>{const match=error.match(/第\s*(\d+)\s*项/);return match&&Number(match[1])===i+1;});input.setAttribute('aria-invalid',String(Boolean(itemErrors.length||general.length)));document.getElementById(input.id+'-error').textContent=itemErrors.join('；');});
  }else{form.elements[key].setAttribute('aria-invalid',String(Boolean(errors.length)));document.getElementById(key+'-error').textContent=errors.join('；');}
 }
 return problems.length;
}
form.addEventListener('input',e=>{const key=e.target.dataset.key||e.target.name;if(multiFields.includes(key))syncDirectories(key);changed(key);});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
async function load(){try{const r=await fetch('/api/config',{headers:{'X-Config-Token':token}});if(!r.ok)throw Error('读取失败');const data=await r.json();for(const [k,v] of Object.entries(data.values)){if(multiFields.includes(k))loadDirectories(k,v);else if(form.elements[k])form.elements[k].value=v;}for(const k of data.configured_keys)form.elements[k].placeholder='已配置，留空保持不变';document.getElementById('location').textContent=data.path;showOverrides(data.overrides);showProblems(data.problems);status.textContent=data.problems.length?`还有 ${data.problems.length} 项待配置`:'目录已就绪，可以返回终端开始处理';loading=false;}catch(e){status.className='error';status.textContent='读取失败，请刷新页面重试';}save.disabled=loading||!dirty;}
form.addEventListener('submit',async e=>{e.preventDefault();if(loading||saving)return;saving=true;save.disabled=true;save.textContent='正在保存…';status.className='';status.textContent='正在保存配置…';const submittedRevision=revision;try{multiFields.forEach(key=>{syncDirectories(key);loadDirectories(key,form.elements[key].value);});const values=Object.fromEntries(new FormData(form));const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-Config-Token':token},body:JSON.stringify(values)});const data=await r.json();showProblems(data.problems||[]);if(!r.ok){const invalid=form.querySelector('[aria-invalid=true]');if(invalid){selectPanel(invalid.closest('.panel').id);invalid.focus();}throw Error(data.error);}dirty=revision!==submittedRevision;showOverrides(data.overrides);status.textContent=dirty?'配置已保存；还有新修改未保存':data.problems.length?`已保存；还有 ${data.problems.length} 项待配置`:'已保存，目录已就绪。返回终端即可开始';if(!dirty)for(const key of multiFields)loadDirectories(key,data.values?.[key]??form.elements[key].value);if(!dirty)for(const input of form.querySelectorAll('input[type=password]')){if(input.value)input.placeholder='已配置，留空保持不变';input.value='';}}catch(e){status.className='error';status.textContent=e.message==='Failed to fetch'?'连接中断，请确认程序仍在运行后重试':e.message;}finally{saving=false;save.textContent='保存配置';save.disabled=loading||!dirty;}});load();
const browseModal=document.getElementById('browse-modal'),browseTitle=document.getElementById('browse-title'),browsePath=document.getElementById('browse-path'),browseError=document.getElementById('browse-error'),browseRoots=document.getElementById('browse-roots'),browseList=document.getElementById('browse-list');
const browseSelect=document.getElementById('browse-select');
const browse={key:null,path:null,parent:null,valid:false,button:null,input:null,request:0};
function browseFail(msg){browseError.textContent=msg;browseError.hidden=!msg;}
async function browseEnter(path){
  const request=++browse.request;
  browse.valid=false;browse.parent=null;browseSelect.disabled=true;browseFail('');
  try{
    const r=await fetch('/api/dirs'+(path?('?path='+encodeURIComponent(path)):''),{headers:{'X-Config-Token':token}});
    if(!r.ok)throw Error('读取失败');
    const data=await r.json();
    if(request!==browse.request)return;
    browse.path=data.path||null;browse.parent=data.parent||null;browse.valid=!!browse.path&&!data.error;
    browseSelect.disabled=!browse.valid;browseFail(data.error||'');renderBrowse(data);
  }catch(e){
    if(request!==browse.request)return;
    browseFail('无法读取目录，请确认程序仍在运行');
  }
}
function renderBrowse(data){browsePath.textContent=browse.path||'';browseRoots.innerHTML='';if(data&&data.roots)data.roots.forEach(r=>{const b=document.createElement('button');b.type='button';b.textContent=r.name;b.addEventListener('click',()=>browseEnter(r.path));browseRoots.appendChild(b);});browseList.innerHTML='';if(data&&data.dirs&&data.dirs.length){data.dirs.forEach(d=>{const li=document.createElement('li');const b=document.createElement('button');b.type='button';b.textContent=d.name;b.addEventListener('click',()=>browseEnter(d.path));li.appendChild(b);browseList.appendChild(li);});}else if(browse.valid){const li=document.createElement('li');li.className='modal-empty';li.textContent='该目录下没有子目录';browseList.appendChild(li);}}
function openBrowse(button,key){browse.key=key;browse.path=null;browse.parent=null;browse.valid=false;browse.button=button;browse.input=button.closest('.directory-row')?.querySelector('input')||form.elements[key];browseTitle.textContent='选择：'+(labels[key]||'目录');browseFail('');browseModal.hidden=false;browseEnter(browse.input.value.trim()||'');document.getElementById('browse-close').focus();}
function closeBrowse(commit){if(!browseModal.hidden&&commit&&browse.key&&browse.path&&browse.valid){const input=browse.input;if(input?.isConnected){input.value=browse.path;input.dispatchEvent(new Event('input',{bubbles:true}));}}browse.request++;browse.valid=false;browseSelect.disabled=true;browseModal.hidden=true;if(browse.button?.isConnected)browse.button.focus();}
form.addEventListener('click',e=>{const button=e.target.closest('.browse');if(button)openBrowse(button,button.dataset.key);});
document.getElementById('browse-select').addEventListener('click',()=>closeBrowse(true));
document.getElementById('browse-cancel').addEventListener('click',()=>closeBrowse(false));
document.getElementById('browse-close').addEventListener('click',()=>closeBrowse(false));
document.getElementById('browse-up').addEventListener('click',()=>{if(browse.parent)browseEnter(browse.parent);});
browseModal.addEventListener('click',e=>{if(e.target===browseModal)closeBrowse(false);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!browseModal.hidden)closeBrowse(false);});
</script></body></html>
