name: TUI regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime imports
        run: python -m pip install -r requirements.txt
      - name: Install FFmpeg for synthetic audio integration (test only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
      - name: Install test runner (development only)
        run: python -m pip install pytest
      - name: Syntax check
        run: python -m compileall -q pycut tests
      - name: Bash launcher syntax check
        run: bash -n run.sh
      - name: TUI, core safety and synthetic audio regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Full suite (synthetic media only; user media opt-in)
        run: python -m pytest tests/ -q

  cross-platform-picker:
    name: Folder picker (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime dependencies and test runner
        run: python -m pip install -r requirements.txt
      - name: Cross-platform Textual folder picker checks (headless)
        run: python -m unittest discover -s tests -p 'test_tui_textual_picker.py' -v
