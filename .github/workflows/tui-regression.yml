name: TUI regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install runtime imports
        run: python -m pip install -r requirements.txt
      - name: Install test runner (development only)
        run: python -m pip install pytest
      - name: Syntax check
        run: python -m compileall -q pycut tests
      - name: TUI and core safety regression tests (no videos or LLM)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Full pure-logic suite (device media tests skip explicitly)
        run: python -m pytest tests/ -q
