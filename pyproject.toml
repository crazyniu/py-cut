[project]
name = "pycut"
version = "0.1.0"
description = "短视频处理工具箱：字幕擦除 / 去重 / 混剪"
readme = "README.md"
requires-python = ">=3.13"
# Launchers/requirements.txt supply video dependencies; package metadata adds the picker.
dependencies = [
    "textual-fspicker==1.0.1",
    "windows-curses>=2.4; sys_platform == 'win32'",
]

[project.scripts]
pycut = "pycut.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pycut", "pycut.core", "pycut.commands", "pycut.desktop"]
