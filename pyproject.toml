[project]
name = "pycut"
version = "0.1.0"
description = "短视频智能处理工具箱：切片 / 混剪 / 转场 / 查重"
readme = "README.md"
requires-python = ">=3.13"
# 依赖由「自带 cv2 的托管解释器」提供（cv2 / numpy / ffmpeg-full）。
# 核心视频依赖依旧由本机托管解释器/requirements.txt 提供；TUI 引入成熟的开源选择器。
dependencies = [
    "textual-fspicker==1.0.1",
    "windows-curses>=2.4; sys_platform == 'win32'",
]

[project.scripts]
pycut = "pycut.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pycut", "pycut.core", "pycut.commands"]
